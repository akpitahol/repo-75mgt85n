<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图书馆座位排列工具</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>图书馆座位排列工具</h1>
    <p class="subtitle">共 208 个座位 · 批量粘贴姓名并按标签自动分区上色</p>
  </header>

  <div class="layout">
    <!-- 控制面板 -->
    <aside class="panel">
      <section class="card">
        <h2>批量录入</h2>
        <label class="field">
          <span>标签（如：电气工程学院）</span>
          <input id="labelInput" type="text" placeholder="输入标签名称" />
        </label>
        <label class="field">
          <span>姓名（每行一个，或用空格/逗号/顿号分隔）</span>
          <textarea id="namesInput" rows="6" placeholder="张三&#10;李四&#10;王五"></textarea>
        </label>
        <div class="btn-row">
          <button id="addBtn" class="btn primary">添加并排座</button>
          <button id="clearBtn" class="btn ghost">清空全部</button>
        </div>

        <label class="mode-toggle">
          <input type="checkbox" id="regionMode" />
          <span>手动选区模式</span>
        </label>
        <div id="selInfo" class="sel-info" hidden>
          已选 <b id="selCount">0</b> 个座位 ·
          <button id="clearSelBtn" class="link-btn">清除选区</button>
          <p class="hint">在座位图上拖动框选一片区域（单击可增/减单个座位），再点「添加并排座」即可排入选区。</p>
        </div>
        <p id="status" class="status"></p>
      </section>

      <section class="card tips">
        <h2>操作提示</h2>
        <ul class="tip-list">
          <li>普通模式：直接拖动姓名到其它座位可<b>移动</b>，拖到已有人处可<b>互换</b>。</li>
          <li>双击座位可<b>移除</b>该人。</li>
          <li>点击图例色块可<b>换色</b>，双击图例名称可<b>重命名</b>标签。</li>
          <li>勾选「手动选区模式」可框选区域，把某批人精确排到指定位置。</li>
        </ul>
      </section>
    </aside>

    <!-- 座位图 -->
    <main class="seatmap-wrap">
      <div class="seatmap-toolbar">
        <div class="legend-head">
          <h2>标签图例</h2>
          <span id="seatStat" class="seat-stat"></span>
          <button id="exportBtn" class="btn primary export-btn">导出图片</button>
        </div>
      </div>
      <ul id="legend" class="legend legend-row"></ul>

      <div class="seatmap-scroll">
        <div id="seatmap" class="seatmap"></div>
        <div class="stage">主 台</div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
